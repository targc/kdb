apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgres.kdb.io
spec:
  group: kdb.io
  names:
    kind: Postgres
    plural: postgres
    singular: postgres
    shortNames:
      - pg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [user, password, storage]
              properties:
                user:
                  type: string
                  description: POSTGRES_USER
                password:
                  type: string
                  description: POSTGRES_PASSWORD
                database:
                  type: string
                  description: POSTGRES_DB (default postgres)
                image:
                  type: string
                  description: Docker image (default postgres:16)
                storage:
                  type: object
                  required: [pvcName, size, storageClass, accessModes]
                  properties:
                    pvcName:
                      type: string
                      description: Name of the PersistentVolumeClaim
                    size:
                      type: string
                      pattern: '^\d+(Mi|Gi)$'
                      description: "Storage size (e.g. 512Mi, 1Gi)"
                    storageClass:
                      type: string
                      description: StorageClass name
                    accessModes:
                      type: array
                      items:
                        type: string
                        enum: [ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod]
                      description: PVC access modes
                    mountPath:
                      type: string
                      description: Mount path in container (default /var/lib/postgresql/data)
                resources:
                  type: object
                  description: Container CPU/memory requests and limits
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                port:
                  type: integer
                host:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Host
          type: string
          jsonPath: .status.host
        - name: Port
          type: integer
          jsonPath: .status.port
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
